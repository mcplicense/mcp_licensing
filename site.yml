AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MCP tool licensing - public website: a private S3 bucket served through
  CloudFront (HTTPS only, security headers), with the same WAF web ACL that
  protects the API (edge.yml). Deploy it AFTER edge.yml, in us-east-1.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  DomainName:
    Type: String
    Description: The site's main host name, for example mcplicense.net. www.<DomainName> redirects to it.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that contains DomainName.
  WebAclArn:
    Type: String
    Description: Output WebAclArn of the edge.yml stack.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
  ApiId:
    Type: String
    Description: Output ApiId of the template.yml stack (the contact form's Lambda is behind it).
  ApiRegion:
    Type: String
    Default: us-east-1
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: The same secret as OriginSecret in template.yml and edge.yml.

Resources:

  # ----------------------------------------------------------------- bucket
  # Private. Only this CloudFront distribution may read it (origin access
  # control); nothing is ever served straight from S3.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versioning lets a bad upload be rolled back; old versions are pruned.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadOnlyFromThisDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # With this permission S3 answers a missing file with 404. Without it S3 answers 403 (it will
          # not say whether a key exists), and mapping 403 to the 404 page would also swallow the 403
          # responses of the contact form on the API path.
          - Sid: ListForCorrectNotFoundAnswers
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: RefuseUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub mcp-licensing-site-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------ certificate
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub www.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub www.${DomainName}
          HostedZoneId: !Ref HostedZoneId

  # ------------------------------------------------------- request rewriting
  # S3 does not serve /docs/ as /docs/index.html, so this rewrites it. It also
  # sends www and the raw cloudfront.net name to the main host, and /docs to /docs/.
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub mcp-licensing-site-${Stage}-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Index documents and host redirects for the static site.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';
          var uri = request.uri;
          if (host !== '${DomainName}') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + uri } }
            };
          }
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
            return request;
          }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + uri + '/' } }
            };
          }
          return request;
        }

  # --------------------------------------------------------- security headers
  # The pages carry no inline script and no inline style. Scripts may only be files served by this
  # site (script-src 'self'), and they may only talk back to this site (connect-src 'self', which
  # is how the sign-up and console pages reach /v1/portal and /v1/console). Nothing else is
  # allowed: no third-party script, font, image, frame or form target.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub mcp-licensing-site-${Stage}-security
        Comment: Security headers for the static site.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self';
              base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true

  # --------------------------------------------------- the form's route to the API
  # Only /v1/site/* goes to the API from this domain, and it is sent without
  # cookies, query strings, API keys or the viewer's Host header. It does carry
  # CloudFront-Viewer-Address, which the API uses to limit one visitor's attempts.
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub mcp-licensing-site-${Stage}-api
        Comment: What the website's API routes need.
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Address
            - CloudFront-Viewer-Country
            - Content-Type
            - Origin
            - Referer
            - User-Agent
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: none

  # Sign-up and login. The only API path that sees the session cookie (the refresh token, which the
  # browser keeps out of reach of scripts); X-Requested-With is the marker the portal requires.
  PortalOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub mcp-licensing-site-${Stage}-portal
        Comment: Sign-up and login.
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Address
            - CloudFront-Viewer-Country
            - Content-Type
            - Origin
            - Referer
            - User-Agent
            - X-Requested-With
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies:
            - mcp_rt
        QueryStringsConfig:
          QueryStringBehavior: none

  # The console API. It carries the ID token (Authorization) and no cookies at all.
  ConsoleOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub mcp-licensing-site-${Stage}-console
        Comment: The signed-in console.
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Authorization
            - CloudFront-Viewer-Address
            - CloudFront-Viewer-Country
            - Content-Type
            - Origin
            - Referer
            - User-Agent
            - X-Requested-With
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  # ------------------------------------------------------------- CloudFront
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub MCP licensing website ${Stage}
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        WebACLId: !Ref WebAclArn
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${ApiId}.execute-api.${ApiRegion}.amazonaws.com
            OriginPath: !Sub /${Stage}
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        CacheBehaviors:
          - PathPattern: /v1/site/*
            TargetOriginId: api
            # https-only: a redirect would turn the form's POST into a GET.
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # managed CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /v1/portal/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # managed CachingDisabled
            OriginRequestPolicyId: !Ref PortalOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /v1/console/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # managed CachingDisabled
            OriginRequestPolicyId: !Ref ConsoleOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # Managed CachingOptimized. The deploy invalidates the cache.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        # Only 404 is mapped: error responses are per distribution, so mapping 403 as well would
        # replace the contact form's own 403 answers with this page.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 5

  # ------------------------------------------------------------------- DNS
  # Z2FDTNDATAQYW2 is the fixed hosted zone id of every CloudFront distribution.
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApexAaaa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAaaa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}
  BucketName:
    Description: Upload the built site here (see README, Website).
    Value: !Ref SiteBucket
  DistributionId:
    Description: Invalidate this after an upload.
    Value: !Ref Distribution
