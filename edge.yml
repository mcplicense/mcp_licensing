AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MCP tool licensing - edge: CloudFront with WAF in front of the HTTP API, a
  TLS certificate and DNS for the public domain. Deploy it AFTER template.yml,
  in us-east-1 (CloudFront certificates and CloudFront-scope WAF live there).

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  DomainName:
    Type: String
    Description: Public host name, for example api.mcplicense.net.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that contains DomainName.
  ApiId:
    Type: String
    Description: Output ApiId of the template.yml stack.
  ApiRegion:
    Type: String
    Default: us-east-1
    Description: Region of the template.yml stack.
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Secret sent to the API in the X-Origin-Verify header. Use the same value
      as OriginSecret in the template.yml stack.
  ManagedRulesMode:
    Type: String
    Default: Count
    AllowedValues: [Count, Block]
    Description: >-
      Count only logs what the AWS managed rule groups would block; Block
      enforces them. Start with Count, review the WAF log, then switch to Block.
  VerifyRateLimit:
    Type: Number
    Default: 600
    MinValue: 10
    Description: Requests per 5 minutes per IP address on /v1/mcp/ before WAF answers 429.
  AdminRateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    Description: Requests per 5 minutes per IP address on /v1/admin/.
  SuperRateLimit:
    Type: Number
    Default: 50
    MinValue: 10
    Description: Requests per 5 minutes per IP address on /v1/super/.
  OverallRateLimit:
    Type: Number
    Default: 2000
    MinValue: 10
    Description: Requests per 5 minutes per IP address across all /v1/ (API) paths.
  ContactRateLimit:
    Type: Number
    Default: 10
    MinValue: 10
    Description: >-
      Contact form posts per 10 minutes per IP address before WAF answers 429. A backstop: the
      Lambda allows each visitor 3 messages and then locks them out for 30 minutes.
  PortalRateLimit:
    Type: Number
    Default: 60
    MinValue: 10
    Description: >-
      Sign-up, login and password-reset requests per 5 minutes per IP address before WAF answers 429. A backstop:
      the portal Lambda has its own exact limits (3 sign-ups then a 30-minute lock, and more).
  ConsoleRateLimit:
    Type: Number
    Default: 600
    MinValue: 10
    Description: Console API requests per 5 minutes per IP address.
  SiteRateLimit:
    Type: Number
    Default: 600
    MinValue: 10
    Description: Requests per 5 minutes per IP address outside /v1/ (the website, with its images and styles).
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: Which CloudFront edge locations serve requests (100 = North America and Europe, cheapest).
  WafLogRetentionDays:
    Type: Number
    Default: 30
  RequestAlarmThreshold:
    Type: Number
    Default: 3000
    Description: Alarm when CloudFront sees more than this many requests in 5 minutes.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Address to notify when an alarm fires. Empty creates the alarms without notifications.

Conditions:
  ManagedBlocks: !Equals [!Ref ManagedRulesMode, Block]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:

  # ------------------------------------------------------------ certificate
  # Validated through DNS: CloudFormation creates the validation record in the
  # hosted zone itself and waits for the certificate to be issued.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # -------------------------------------------------------------------- WAF
  # Per-IP rate limits answer 429 (not WAF's default 403) because the client
  # helper treats a plain 403 as a license decision. A shared office address
  # that hits a limit therefore keeps its tools running on their cached result.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub mcp-licensing-${Stage}
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub mcp-licensing-${Stage}
      CustomResponseBodies:
        rate_limited:
          ContentType: APPLICATION_JSON
          Content: '{"valid": false, "reason": "RATE_LIMITED", "message": "Too many requests from this address. Retry shortly."}'
      Rules:
        - Name: rate-verify
          Priority: 10
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref VerifyRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/mcp/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-verify

        # The website's contact form (a post from a page on mcplicense.net, reaching the API
        # through the site distribution). The exact limit and the 30-minute lock are in the Lambda.
        - Name: rate-contact
          Priority: 15
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref ContactRateLimit
              EvaluationWindowSec: 600
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/site/contact
                  PositionalConstraint: EXACTLY
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-contact

        - Name: rate-portal
          Priority: 16
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref PortalRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/portal/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-portal

        - Name: rate-console
          Priority: 17
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref ConsoleRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/console/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-console

        - Name: rate-admin
          Priority: 20
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref AdminRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/admin/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-admin

        - Name: rate-super
          Priority: 30
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref SuperRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/super/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-super

        - Name: rate-overall
          Priority: 40
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref OverallRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /v1/
                  PositionalConstraint: STARTS_WITH
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-overall

        # The website shares this web ACL. Its page loads must not use up the
        # per-IP budget of the API (an office whose people browse the docs
        # also runs MCP tools), so everything outside /v1/ has its own rule.
        - Name: rate-site
          Priority: 45
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rate_limited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '60'
          Statement:
            RateBasedStatement:
              Limit: !Ref SiteRateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    ByteMatchStatement:
                      SearchString: /v1/
                      PositionalConstraint: STARTS_WITH
                      FieldToMatch:
                        UriPath: {}
                      TextTransformations:
                        - Priority: 0
                          Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-site

        - Name: aws-common
          Priority: 100
          OverrideAction: !If [ManagedBlocks, {None: {}}, {Count: {}}]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common

        - Name: aws-known-bad-inputs
          Priority: 110
          OverrideAction: !If [ManagedBlocks, {None: {}}, {Count: {}}]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs

        - Name: aws-ip-reputation
          Priority: 120
          OverrideAction: !If [ManagedBlocks, {None: {}}, {Count: {}}]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-ip-reputation

  # WAF writes one log line per request, which is how the Count-mode rules are
  # reviewed. API keys and the origin secret are redacted from the log.
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub aws-waf-logs-mcp-licensing-${Stage}
      RetentionInDays: !Ref WafLogRetentionDays

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}
      RedactedFields:
        - SingleHeader:
            Name: x-tenant-api-key
        - SingleHeader:
            Name: x-origin-verify

  # ------------------------------------------------------------- CloudFront
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub MCP licensing ${Stage}
        Aliases:
          - !Ref DomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: api
            DomainName: !Sub ${ApiId}.execute-api.${ApiRegion}.amazonaws.com
            OriginPath: !Sub /${Stage}
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: api
          # https-only: a redirect would turn a POST into a GET.
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: false
          # Managed policies: CachingDisabled, and AllViewerExceptHostHeader
          # (forwards X-Tenant-Api-Key and the body untouched).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ------------------------------------------------------------------- DNS
  # Z2FDTNDATAQYW2 is the fixed hosted zone id of every CloudFront distribution.
  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DnsRecordAaaa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ----------------------------------------------------------------- alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub mcp-licensing-${Stage}-edge-alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  RequestVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mcp-licensing-${Stage}-request-volume
      AlarmDescription: Unusually many requests reached the API in 5 minutes.
      Namespace: AWS/CloudFront
      MetricName: Requests
      Dimensions:
        - Name: DistributionId
          Value: !Ref Distribution
        - Name: Region
          Value: Global
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref RequestAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mcp-licensing-${Stage}-5xx-errors
      AlarmDescription: More than 5 percent of requests failed with a 5xx for 10 minutes.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref Distribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  PublicUrl:
    Description: Base URL for clients and Postman (no stage in the path).
    Value: !Sub https://${DomainName}
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
  WafLogGroup:
    Value: !Ref WafLogGroup
